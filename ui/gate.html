<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>melea — access</title>
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <style>
      :root {
        color-scheme: dark;
        --bg: #0f1115;
        --panel: #1f232c;
        --text: #e7e9ee;
        --text-dim: #9aa3b2;
        --border: #2a2f3a;
        --accent-on-dark: #8fb6ff;
        --accent: var(--accent-on-dark);
        --accent-dim: #1e5fa8;
        --bad: #e87878;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: var(--bg);
        color: var(--text);
        font-family: "Roboto Flex", system-ui, sans-serif;
      }
      .panel {
        width: min(100%, 22rem);
        padding: 1.75rem;
        border: 1px solid var(--border);
        border-radius: 12px;
        background: var(--panel);
      }
      h1 {
        margin: 0 0 0.35rem;
        font-size: 1.25rem;
        font-weight: 600;
      }
      p {
        margin: 0 0 1.25rem;
        color: var(--text-dim);
        font-size: 0.92rem;
        line-height: 1.45;
      }
      label {
        display: block;
        margin-bottom: 0.4rem;
        font-size: 0.85rem;
        color: var(--text-dim);
      }
      input {
        width: 100%;
        padding: 0.65rem 0.75rem;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: var(--bg);
        color: var(--text);
        font: inherit;
      }
      input:focus {
        outline: 2px solid color-mix(in srgb, var(--accent) 55%, transparent);
        border-color: var(--accent);
      }
      button {
        margin-top: 1rem;
        width: 100%;
        padding: 0.7rem 1rem;
        border: none;
        border-radius: 8px;
        background: var(--accent);
        color: #0f1115;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.6;
        cursor: wait;
      }
      .error {
        margin-top: 0.75rem;
        color: var(--bad);
        font-size: 0.88rem;
        min-height: 1.2em;
      }
    </style>
  </head>
  <body>
    <div class="panel">
      <h1>melea</h1>
      <p>Enter the site password to continue.</p>
      <form id="gate-form">
        <label for="gate-password">Password</label>
        <input
          type="password"
          id="gate-password"
          name="password"
          autocomplete="current-password"
          required
        />
        <button type="submit" id="gate-submit">Continue</button>
        <div class="error" id="gate-error" aria-live="polite"></div>
      </form>
    </div>
    <script>
      (() => {
        const params = new URLSearchParams(window.location.search);
        const next = params.get("next") || "/app";
        const form = document.getElementById("gate-form");
        const input = document.getElementById("gate-password");
        const submit = document.getElementById("gate-submit");
        const errEl = document.getElementById("gate-error");

        form.addEventListener("submit", async (event) => {
          event.preventDefault();
          errEl.textContent = "";
          submit.disabled = true;
          try {
            const resp = await fetch("/api/site-gate/unlock", {
              method: "POST",
              credentials: "same-origin",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({
                password: input.value,
                next,
              }),
            });
            let body = null;
            try {
              body = await resp.json();
            } catch (_) {}
            if (!resp.ok) {
              const detail = body && body.detail;
              errEl.textContent =
                typeof detail === "string" ? detail : "Incorrect password.";
              return;
            }
            window.location.replace(
              body && body.next && body.next.startsWith("/") ? body.next : next,
            );
          } catch (_) {
            errEl.textContent = "Network error. Try again.";
          } finally {
            submit.disabled = false;
          }
        });

        input.focus();
      })();
    </script>
  </body>
</html>
