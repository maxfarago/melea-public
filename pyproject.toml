[project]
name = "melea-api"
version = "1.0.0"
description = "Melea API and ingestion helpers"
requires-python = ">=3.11"
dependencies = [
    "aiosqlite>=0.20",
    "anthropic>=0.50",
    "beautifulsoup4>=4.12",
    "boto3>=1.35",
    "fastapi>=0.115",
    "httpx>=0.27",
    "lxml>=5.0",
    "openai>=1.50",
    "pgvector>=0.3",
    "psycopg[binary,pool]>=3.2",
    "playwright>=1.49",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "python-multipart>=0.0.9",
    "pyyaml>=6.0",
    "uvicorn[standard]>=0.32",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["api*", "llm*", "ingestion*", "commons*"]

[tool.setuptools.package-data]
"llm" = ["prompts/*.yaml", "prompts/*.yml"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
